services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: trustclaw
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: trustclaw
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trustclaw -d trustclaw"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://trustclaw:${POSTGRES_PASSWORD}@db:5432/trustclaw
      REDIS_URL: redis://redis:6379
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in .env}
      COMPOSIO_API_KEY: ${COMPOSIO_API_KEY:?Set COMPOSIO_API_KEY in .env}
      CRON_SECRET: ${CRON_SECRET:?Set CRON_SECRET in .env}
      AI_GATEWAY_API_KEY: ${AI_GATEWAY_API_KEY:?Set AI_GATEWAY_API_KEY in .env}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      ALLOW_OPEN_SIGNUP: ${ALLOW_OPEN_SIGNUP:-true}
      ADMIN_USER_ID: ${ADMIN_USER_ID:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      GLEN_ENABLED: ${GLEN_ENABLED:-false}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Vercel triggers /api/cron/trustclaw from vercel.json; self-hosting needs
  # something to do the same. This calls it once a minute.
  cron:
    image: curlimages/curl:8.11.1
    restart: unless-stopped
    environment:
      CRON_SECRET: ${CRON_SECRET:?Set CRON_SECRET in .env}
    entrypoint:
      - sh
      - -c
      - |
        while true; do
          curl -fsS -H "Authorization: Bearer $$CRON_SECRET" http://app:3000/api/cron/trustclaw > /dev/null || echo "cron call failed"
          sleep 60
        done
    depends_on:
      - app

volumes:
  db-data:
  redis-data:
